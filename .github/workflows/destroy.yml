name: Terrafrom Destroy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::949940714686:role/github-actions-cicd
  TERRAFORM_VERSION: 1.10.0

jobs:
    validate-and-scan:
        name: Terrafrom Destroy
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v2
            with:
              role-to-assume: ${{ env.AWS_ROLE_ARN }}
              aws-region: ${{ env.AWS_REGION }}

          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v2
            with:
              terraform_version: ${{ env.TERRAFORM_VERSION }}

          - name: Trigger Terraform Run (Destroy)
            uses: kvrhdn/tfe-run@v1
            with:
              token: ${{ secrets.TF_API_TOKEN }}
              organization: samlozano
              workspace: test-workspace
              message: "Destroy run triggered by GitHub Actions"
              # Change the type to 'destroy'
              type: destroy
              terraform_root: ./terraform